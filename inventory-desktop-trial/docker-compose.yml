services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: makhzouni_trial
      POSTGRES_USER: trial_user
      POSTGRES_PASSWORD: trial_local_password
    ports:
      - "55432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trial_user -d makhzouni_trial"]
      interval: 3s
      timeout: 3s
      retries: 20

